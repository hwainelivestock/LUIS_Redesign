<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New order - LUIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/luis.css">
  <style>
    .species-item {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
      cursor: pointer;
    }

    .species-item:hover {
      background: #f8f9fa;
    }

    .species-item.active {
      border-left-color: #0d3349;
      background: #eef1f2;
    }

    /* ── Flock picker popover ── */
    .flock-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1050;
      background: rgba(13,51,73,0.18);
      display: none;
    }
    .flock-popover-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      max-width: calc(100vw - 32px);
      max-height: 80vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e7eaec;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    }
    .flock-popover__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0d3349;
      color: #fff;
      border-radius: 8px 8px 0 0;
    }
    .flock-popover__title {
      font-size: 14px;
      font-weight: 600;
    }
    .flock-popover__sub {
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      margin-top: 2px;
    }
    .flock-popover__dismiss {
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .flock-popover__dismiss:hover { color: #fff; }
    .flock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #eef0f1;
      cursor: pointer;
      font-size: 13px;
      color: #0d3349;
      font-weight: 500;
    }
    .flock-row:last-child { border-bottom: none; }
    .flock-row:hover { background: #f5f7f8; }
    .flock-mixed-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: #dde6ec;
      border: 1px solid #c3d0d8;
      border-radius: 4px;
      font-size: 11px;
      color: #0d3349;
      font-weight: 500;
      margin-left: 8px;
      white-space: nowrap;
    }

  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-dark px-3">
    <div class="d-flex align-items-center">
      <span class="navbar-brand mb-0 h5 font-weight-bold">New order</span>
    </div>
    <div class="d-flex align-items-center">
      <a href="#" class="nav-link mr-2">
        <i class="fas fa-question-circle mr-1"></i>ETM Guidance
      </a>
      <a href="#" class="nav-link mr-2">
        <i class="fas fa-info-circle mr-1"></i>FAQs
      </a>
      <a href="#" class="nav-link mr-3" style="color:#c8d400;">
        <i class="fas fa-user mr-1"></i>As: Allflex UK Group Ltd
        <i class="fas fa-caret-down ml-1"></i>
      </a>
      <img src="images/luis-logo.svg" alt="LUIS - Livestock Unique Identification Service" style="width:44px;height:44px;">
    </div>
  </nav>

  <!-- Yellow stripe -->
  <div class="luis-stripe"></div>

  <!-- Rail layout -->
  <div class="luis-rail-layout">

    <!-- Icon rail -->
    <nav class="luis-rail" id="luis-rail">
      <div class="rail-top">
        <a href="index.html"
           class="rail-item rail-etm"
           title="Return to admin dashboard">
          <i class="fas fa-exchange-alt"></i>
          <span class="rail-label">Return to Admin</span>
        </a>
        <a href="etm-dashboard.html"
           class="rail-item active"
           title="Dashboard">
          <i class="fas fa-th-large"></i>
          <span class="rail-label">Dashboard</span>
        </a>
        <div class="rail-divider"></div>
        <button class="rail-item"
                id="rail-btn-searches"
                onclick="toggleRail('searches')"
                title="Searches">
          <i class="fas fa-search"></i>
          <span class="rail-label">Searches</span>
        </button>
        <button class="rail-item"
                id="rail-btn-manage"
                onclick="toggleRail('manage')"
                title="Manage">
          <i class="fas fa-cog"></i>
          <span class="rail-label">Manage</span>
        </button>
      </div>
      <div class="rail-bottom">
        <div class="rail-divider"></div>
        <a href="#" class="rail-item rail-logout" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
          <span class="rail-label">Logout</span>
        </a>
      </div>
    </nav>

    <!-- ETM flyout panel -->
    <div class="luis-flyout" id="luis-flyout">

      <div class="flyout-panel" id="flyout-searches">
        <div class="flyout-header">Searches</div>
        <a href="select-keeper-etm.html" class="flyout-item" onclick="closeFlyout()">
          <i class="fas fa-user"></i> Keeper search
        </a>
        <a href="tag-history.html?etm=true" class="flyout-item" onclick="closeFlyout()">
          <i class="fas fa-tag"></i> Tag history
        </a>
        <a href="recent-orders-etm.html" class="flyout-item" onclick="closeFlyout()">
          <i class="fas fa-file-alt"></i> Recent orders
        </a>
        <a href="recent-cancellations-etm.html" class="flyout-item" onclick="closeFlyout()">
          <i class="fas fa-times-circle"></i> Recent cancellations
        </a>
        <a href="recent-recoveries-etm.html" class="flyout-item" onclick="closeFlyout()">
          <i class="fas fa-redo"></i> Recent recoveries
        </a>
      </div>

      <div class="flyout-panel" id="flyout-manage">
        <div class="flyout-header">Manage</div>
        <a class="flyout-item" style="opacity:0.4;cursor:not-allowed;" aria-disabled="true" tabindex="-1">
          <i class="fas fa-check-circle"></i> Approved tags
        </a>
        <a class="flyout-item" style="opacity:0.4;cursor:not-allowed;" aria-disabled="true" tabindex="-1">
          <i class="fas fa-user"></i> Users
        </a>
      </div>

    </div>

    <!-- Page content -->
    <main class="rail-content flex-grow-1 py-0 px-0" style="display:flex;flex-direction:column;background:#f4f5f6;">
      <div style="display:flex;flex:1;min-height:0;">

        <!-- Left panel -->
        <div style="width:200px;flex-shrink:0;border-right:1px solid #e7eaec;background:#fff;display:flex;flex-direction:column;">

          <div style="font-size:10px;text-transform:uppercase;color:#888;letter-spacing:0.07em;padding:6px 16px 4px;">Species</div>

          <div id="species-list" style="flex:1;display:flex;flex-direction:column;"></div>

        </div>

        <!-- Right column wrapper -->
        <div style="flex:1;display:flex;flex-direction:column;min-height:0;">
          <div id="context-card-root"></div>
          <div id="species-panel" style="flex:1;padding:16px 20px;overflow-y:auto;">
            <!-- Populated by JS on load -->
          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer class="luis-footer">
    <a href="#">Privacy Policy <i class="fas fa-external-link-alt"></i></a>
    <a href="#">Cookie Policy <i class="fas fa-external-link-alt"></i></a>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/luis.js"></script>
  <script src="js/luis-data.js"></script>
  <script src="js/select-species.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () { toggleRail('searches'); });
  </script>
</body>
</html>
