<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Manufacturer - LUIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="css/luis.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-dark px-3">
    <div class="d-flex align-items-center">
      <span class="navbar-brand mb-0 h5 font-weight-bold">Select manufacturer</span>
    </div>
    <div class="d-flex align-items-center">
      <img src="images/luis-logo.svg" alt="LUIS - Livestock Unique Identification Service" style="width:44px;height:44px;">
    </div>
  </nav>

  <!-- Yellow stripe -->
  <div class="luis-stripe"></div>

  <!-- Rail layout -->
  <div class="luis-rail-layout">

    <!-- Icon rail -->
    <nav class="luis-rail" id="luis-rail">
      <div class="rail-top">
        <a href="index.html"
           class="rail-item active"
           title="Home">
          <i class="fas fa-home"></i>
          <span class="rail-label">Home</span>
        </a>
      </div>
      <div class="rail-bottom">
        <div class="rail-divider"></div>
        <a href="#" class="rail-item rail-logout" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
          <span class="rail-label">Logout</span>
        </a>
      </div>
    </nav>

    <!-- Page content -->
    <main class="rail-content flex-grow-1 py-3 px-4"
          style="background:#f4f5f6;">
      <div class="search-card">
        <p class="search-card__title">Select a manufacturer</p>
        <p class="search-card__help">Choose the manufacturer on whose behalf you wish to act.</p>
        <select class="search-card__select" aria-label="Manufacturer">
          <option value="" selected disabled hidden>Select a manufacturer</option>
          <option value="allflex">Allflex UK Group Ltd</option>
          <option value="dalton" disabled>Dalton Livestock ID</option>
          <option value="shearwell" disabled>Shearwell Data Ltd</option>
        </select>
        <div class="mfr-actions">
          <a href="etm-dashboard.html" class="btn btn-luis">Continue</a>
          <a href="index.html" class="mfr-back">Back</a>
        </div>
      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer class="luis-footer">
    <a href="#">Privacy Policy <i class="fas fa-external-link-alt"></i></a>
    <a href="#">Cookie Policy <i class="fas fa-external-link-alt"></i></a>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/luis.js"></script>
</body>
</html>
